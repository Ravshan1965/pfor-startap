name: PFOR MVP Auto-Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Free disk space
        run: |
          df -h
          sudo apt-get clean || true
          sudo rm -rf /tmp/* || true
          docker system prune -af || true
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip --no-cache-dir
          if [ -f requirements.txt ]; then pip install -r requirements.txt --no-cache-dir; fi

      - name: Setup and Restart FastAPI Service
        run: |
          sudo ufw allow 80/tcp || true
          
          cat << EOF | sudo tee /etc/systemd/system/pfor.service
          [Unit]
          Description=PFOR FastAPI Server
          After=network.target

          [Service]
          User=root
          WorkingDirectory=${{ github.workspace }}
          Environment="PATH=${{ github.workspace }}/venv/bin"
          Environment="PYTHONPATH=${{ github.workspace }}/src"
          ExecStart=${{ github.workspace }}/venv/bin/uvicorn pfor.main:app --host 0.0.0.0 --port 80
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOF
          
          sudo systemctl daemon-reload
          sudo systemctl enable pfor
          sudo systemctl restart pfor
          echo "✅ pfor service created and started on port 80!"
