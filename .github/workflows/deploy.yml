name: PFOR MVP Auto-Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Free disk space
        run: |
          df -h
          sudo apt-get clean || true
          sudo rm -rf /tmp/* || true
          docker system prune -af || true
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip --no-cache-dir
          if [ -f requirements.txt ]; then pip install -r requirements.txt --no-cache-dir; fi

      - name: Restart FastAPI Service
        run: |
          if systemctl list-units --full -all | grep -Fq "pfor.service"; then
            sudo systemctl restart pfor
            echo "✅ pfor service restarted"
          else
            echo "⚠️ pfor.service not found — skipping restart"
            echo "Create the service manually on the server first"
          fi
